[project]
name = "cvertidor"
version = "0.1.0"
description = "Adaptación de CVs a ofertas de trabajo con RAG local (pgvector/Gemini) y grafo cíclico LangGraph + evaluador free de OpenRouter."
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "José Valentín Calderón González" },
    { name = "Mauricio Antonio Hidalgo Rivera" },
]

keywords = ["ai", "rag", "langgraph", "resume", "cv", "supabase", "pgvector", "openrouter"]

dependencies = [
    # --- Core de IA ---
    "pydantic>=2.6",
    "google-genai>=0.3",
    "langchain-core>=0.3",
    "langchain-classic>=0.3",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-google-genai",
    "langchain-postgres[psycopg]",
    "langgraph>=0.2",
    # --- Persistencia ---
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "sqlalchemy>=2.0",
    # --- Config / HTTP ---
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "jupyter>=1.1",
    "lab>=8.10",
]

[project.scripts]
cvertidor = "cvertidor.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvertidor"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
