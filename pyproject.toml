[project]
name = "cvertidor"
version = "0.2.0"
description = "Agente que adapta un currículum a una oferta de trabajo mediante RAG y LangGraph"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "José Valentín Calderón González" },
    { name = "Mauricio Antonio Hidalgo Rivera" },
]
dependencies = [
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "python-dotenv>=1.2",
    "langchain-core>=1.6",
    "langchain-classic>=1.0",
    "langchain-community>=0.4",
    "langchain-text-splitters>=1.1",
    "langchain-google-genai>=4.4",
    "langchain-huggingface>=1.2",
    "langchain-postgres>=0.0.18",
    "psycopg[binary]>=3.3",
    "google-genai>=2.25",
    "sentence-transformers>=6.1",
    "langchain-openai>=1.7.3",
    "httpx>=0.28.1",
]

[project.scripts]
cvertidor = "cvertidor.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
]
notebook = [
    "ipykernel>=7.3",
    "ipython>=9.17",
]

[tool.uv]
default-groups = ["dev", "notebook"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
